# MIND demo broker — Mosquitto 2.x
#
# Two listeners:
#   1883  MQTT/TCP        — the ESP32-C3 mesh root publishes here
#   9001  MQTT/WebSocket  — the web dashboard subscribes here (MQTT.js)
#
# Anonymous access for the demo. Tighten with a password_file / TLS before any
# non-demo deployment (see Milestone 6 notes / esp-sidecar README).

persistence false
log_dest stdout
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
